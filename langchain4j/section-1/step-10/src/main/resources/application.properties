quarkus.langchain4j.openai.api-key=${NVIDIA_API_KEY}
quarkus.langchain4j.openai.base-url=https://integrate.api.nvidia.com/v1
quarkus.langchain4j.openai.chat-model.model-name=nvidia/nemotron-3-ultra-550b-a55b
quarkus.langchain4j.openai.chat-model.log-requests=true
quarkus.langchain4j.openai.chat-model.log-responses=true
quarkus.langchain4j.openai.chat-model.temperature=1.0
quarkus.langchain4j.openai.chat-model.frequency-penalty=0
quarkus.langchain4j.pgvector.dimension=384
rag.location=src/main/resources/rag
quarkus.langchain4j.embedding-model.provider=dev.langchain4j.model.embedding.onnx.bgesmallenq.BgeSmallEnQuantizedEmbeddingModel

quarkus.langchain4j.mcp.weather.transport-type=streamable-http
quarkus.langchain4j.mcp.weather.url=http://localhost:8081/mcp

#Observability
quarkus.datasource.jdbc.telemetry=true
quarkus.datasource.metrics.enabled=true
quarkus.otel.logs.enabled=true
quarkus.otel.traces.enabled=true
quarkus.otel.metrics.enabled=true
%test.quarkus.observability.enabled=false

# The default is 10s, which is not enough once the model has to reason over a
# tool schema or a RAG-augmented prompt. A timeout here surfaces as a dead
# WebSocket, not as an error in the chat, so it is worth being generous.
quarkus.langchain4j.timeout=2m

# Put the trace context in every console line. This is what lets you take a
# traceId from the terminal and find the same request in Tempo, which is the
# whole point of correlating logs with traces.
quarkus.log.console.format=%d{HH:mm:ss} %-5p traceId=%X{traceId}, spanId=%X{spanId} [%c{2.}] (%t) %s%e%n
