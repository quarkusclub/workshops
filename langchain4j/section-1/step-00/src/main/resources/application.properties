quarkus.langchain4j.openai.api-key=${NVIDIA_API_KEY}
quarkus.langchain4j.openai.base-url=https://integrate.api.nvidia.com/v1

quarkus.langchain4j.openai.chat-model.model-name=nvidia/nemotron-3-ultra-550b-a55b
quarkus.langchain4j.openai.chat-model.log-requests=true
quarkus.langchain4j.openai.chat-model.log-responses=true

# NVIDIA NIM speaks the OpenAI protocol, so the quarkus-langchain4j-openai
# extension talks to it unchanged: only base-url, api-key and model-name differ.
# The same holds for any OpenAI-compatible provider, Podman AI Lab included.
# Ollama is the exception worth knowing: it has its own extension,
# quarkus-langchain4j-ollama, whose Dev Service pulls the configured model and
# starts a container when Ollama is not already running locally.

quarkus.langchain4j.timeout=2m
